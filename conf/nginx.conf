worker_processes 1;
error_log /home/bill/src/presntation/local-webserver/logs/error.log warn;
pid /home/bill/src/presntation/local-webserver/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /home/linuxbrew/.linuxbrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /home/bill/src/presntation/local-webserver/logs/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # Bind to all IPv4 and IPv6 interfaces
        listen 0.0.0.0:8088;
        listen [::]:8088;
        server_name _;

        root /home/bill/src/presntation/local-webserver/static;
        index index.html;

        # Allow access from local subnets and anywhere on LAN
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Pluggable backend API reverse proxy
        location /api/ {
            proxy_pass http://127.0.0.1:8081/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # Direct reports browseable directory
        location /raw-reports/ {
            alias /home/bill/src/presntation/local-webserver/reports/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}
